name: Magnet to Release

on:
  workflow_dispatch:
    inputs:
      magnet:
        description: "Magnet linki"
        required: true
        type: string
      tag:
        description: "Release etiketi (boş bırakırsan otomatik)"
        required: false
        type: string

permissions:
  contents: write

jobs:
  download-and-release:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - name: aria2 kur
        run: |
          sudo apt-get update
          sudo apt-get install -y aria2

      - name: Magnet'i indir
        env:
          MAGNET: ${{ inputs.magnet }}
        run: |
          mkdir -p dl
          aria2c \
            --dir=dl \
            --seed-time=0 \
            --bt-stop-timeout=900 \
            --file-allocation=none \
            --summary-interval=30 \
            --bt-save-metadata=false \
            "$MAGNET"
          find dl -name '*.aria2' -delete
          ls -lah dl

      - name: 2 GB üstü dosyaları parçala
        run: |
          # GitHub Releases tek dosya limiti 2 GB
          find dl -type f -size +1900M | while read -r f; do
            split -b 1900M -d "$f" "$f.part"
            rm "$f"
          done
          ls -lah dl

      - name: Release oluştur ve yükle
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG_INPUT: ${{ inputs.tag }}
        run: |
          TAG="${TAG_INPUT:-iso-${{ github.run_number }}}"
          mapfile -t FILES < <(find dl -type f)
          gh release create "$TAG" "${FILES[@]}" \
            --title "$TAG" \
            --notes "Magnet linkinden otomatik indirildi."
