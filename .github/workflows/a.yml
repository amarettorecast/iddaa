name: Scrape Daily Odds (OddsHarvester)

on:
  workflow_dispatch:
    inputs:
      target_date:
        description: 'Kazınacak Tarih (YYYYMMDD) - Boş bırakılırsa bugünü alır'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  scrape-leagues:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install OddsHarvester & Playwright Browsers
        run: |
          python -m pip install --upgrade pip
          pip install oddsharvester
          playwright install --with-deps chromium

      - name: Scrape matches into separate JSON files
        run: |
          INPUT_DATE="${{ github.event.inputs.target_date }}"
          if [ -n "$INPUT_DATE" ]; then
            TARGET_DATE="$INPUT_DATE"
          else
            TARGET_DATE=$(TZ="Europe/Rome" date +'%Y%m%d')
          fi

          echo "Hedef Tarih: $TARGET_DATE"
          echo "TARGET_DATE=$TARGET_DATE" >> $GITHUB_ENV

          MARKETS="1x2,btts,double_chance,draw_no_bet,over_under,european_handicap,asian_handicap"

          mkdir -p output

          LEAGUES=("italy-serie-b" "spain-laliga2" "france-ligue-2")

          for league in "${LEAGUES[@]}"; do
            echo "===================================================="
            echo "Kazıma başlatılıyor: $league | Tarih: $TARGET_DATE"
            echo "===================================================="
            
            oddsharvester upcoming \
              --sport football \
              --league "$league" \
              --date "$TARGET_DATE" \
              --market "$MARKETS" \
              --format json \
              --output "output/${league}.json" \
              --timezone "Europe/Rome" \
              --headless || echo "Uyarı: $league için maç bulunamadı veya kazıma sırasında hata oluştu."
          done

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          git add output/*.json

          if git diff --staged --quiet; then
            echo "Değişiklik veya yeni veri tespit edilmedi. Commit adımı atlanıyor."
          else
            git commit -m "chore(odds): update match odds for $TARGET_DATE [skip ci]"
            git push
          fi
