name: Scrape Weekend Odds to Single JSON

on:
  workflow_dispatch:
    inputs:
      target_dates:
        description: 'Tarihler (Virgülle YYYY-MM-DD,YYYY-MM-DD - Boşsa yaklaşan hafta sonu)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  scrape-and-merge:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install oddsharvester
          playwright install --with-deps chromium

      - name: Scrape Matches
        env:
          PROXY_URL: ${{ secrets.PROXY_URL }}
        run: |
          # 1. Tarihleri YYYY-MM-DD formatında al
          INPUT_DATES="${{ github.event.inputs.target_dates }}"
          if [ -n "$INPUT_DATES" ]; then
            IFS=',' read -r -a DATES <<< "$INPUT_DATES"
          else
            # Gelecek Cuma, Cts, Pazar günleri
            FRIDAY=$(date -d "Friday" +'%Y-%m-%d')
            SATURDAY=$(date -d "Saturday" +'%Y-%m-%d')
            SUNDAY=$(date -d "Sunday" +'%Y-%m-%d')
            DATES=("$FRIDAY" "$SATURDAY" "$SUNDAY")
          fi
          
          echo "Tarama yapılacak tarihler: ${DATES[*]}"
          mkdir -p temp_raw

          # 2. Geçerli spesifik market listesi
          MARKETS="1x2,btts,over_under,correct_score,halftime_fulltime"

          LEAGUES=(
            "netherlands-eerste-divisie"
            "germany-bundesliga"
            "switzerland-super-league"
            "austria-bundesliga"
            "italy-serie-a"
            "spain-laliga"
          )

          PROXY_ARGS=()
          if [ -n "$PROXY_URL" ]; then
            PROXY_ARGS=(--proxy-url "$PROXY_URL")
          else
            echo "UYARI: PROXY_URL tanımlı değil! GitHub IP'si engellenebilir."
          fi

          for target_date in "${DATES[@]}"; do
            target_date=$(echo "$target_date" | xargs)
            for league in "${LEAGUES[@]}"; do
              echo "----------------------------------------------------"
              echo "Taranıyor: $league ($target_date)"
              echo "----------------------------------------------------"
              
              # Hata loglarını bastırmadan doğrudan çalıştır
              oddsharvester upcoming \
                --sport football \
                --league "$league" \
                --date "$target_date" \
                --market "$MARKETS" \
                --format json \
                --output "temp_raw/${league}_${target_date}.json" \
                --timezone "Europe/Rome" \
                --headless \
                "${PROXY_ARGS[@]}" || echo "HATA OLUŞTU: $league ($target_date)"
            done
          done

      - name: Check temp files
        run: |
          echo "İndirilen ara dosyalar ve boyutları:"
          ls -lh temp_raw/

      - name: Merge JSONs into Single File
        run: |
          python - << 'EOF'
          import glob, json, os

          merged = []
          files = glob.glob("temp_raw/*.json")
          print(f"Toplam {len(files)} dosya taranıyor...")

          for filepath in files:
              size = os.path.getsize(filepath)
              if size == 0:
                  print(f"Boş dosya atlandı: {filepath}")
                  continue
              try:
                  with open(filepath, "r", encoding="utf-8") as f:
                      data = json.load(f)
                      matches = data if isinstance(data, list) else data.get("matches", [])
                      print(f"{filepath} içinden {len(matches)} maç okundu.")
                      for m in matches:
                          merged.append(m)
              except Exception as e:
                  print(f"Okuma hatası ({filepath}): {e}")

          os.makedirs("output", exist_ok=True)
          with open("output/weekend_odds.json", "w", encoding="utf-8") as f:
              json.dump(merged, f, ensure_ascii=False, indent=2)

          print(f"SONUÇ: output/weekend_odds.json dosyasına toplam {len(merged)} maç yazıldı.")
          EOF

      - name: Commit and Push
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          git add output/weekend_odds.json
          if git diff --staged --quiet; then
            echo "Değişiklik yok."
          else
            git commit -m "chore(odds): update weekend_odds.json [skip ci]"
            git push
          fi
