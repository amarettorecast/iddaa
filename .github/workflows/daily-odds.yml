name: Daily odds

on:
  schedule:
    # GitHub cron UTC çalışır: 06:00 UTC = 09:00 (Türkiye)
    - cron: "0 6 * * *"
  workflow_dispatch:
    inputs:
      sport:
        description: "Spor dalı"
        default: "football"
      leagues:
        description: "Virgülle lig slug'ları (boş = o günün tüm maçları, çok yavaş olur)"
        default: "england-premier-league,spain-laliga"
      markets:
        description: "Virgülle marketler"
        default: "1x2,btts,over_under,asian_handicap"

permissions:
  contents: write

concurrency:
  group: daily-odds
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      TZ: Europe/Istanbul
      OH_PROXY_URL: ${{ secrets.PROXY_URL }}
      SPORT: ${{ inputs.sport || 'football' }}
      LEAGUES: ${{ github.event_name == 'workflow_dispatch' && inputs.leagues || 'england-premier-league,spain-laliga' }}
      MARKETS: ${{ inputs.markets || '1x2,btts,over_under,asian_handicap' }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Proxy secret kontrolü
        run: |
          if [ -z "$OH_PROXY_URL" ]; then
            echo "::error::PROXY_URL secret tanımlı değil (Settings > Secrets and variables > Actions)"
            exit 1
          fi

      - name: Kurulum
        run: |
          pip install oddsharvester
          playwright install --with-deps chromium

      - name: Bugünün maçlarını çek
        id: scrape
        run: |
          set -euo pipefail
          DAY=$(date +%Y%m%d)
          echo "DAY=$DAY" >> "$GITHUB_ENV"
          mkdir -p raw "data/$DAY"

          args=(upcoming -s "$SPORT" -d "$DAY" -m "$MARKETS"
                --headless --timezone Europe/Istanbul
                --concurrency 2 --request-delay 2
                -f json -o "raw/odds_$DAY")
          if [ -n "$LEAGUES" ]; then
            args+=(-l "$LEAGUES")
          fi

          oddsharvester "${args[@]}"

          RAW=$(find raw -type f -name "odds_${DAY}*" | head -n1)
          if [ -z "$RAW" ]; then
            echo "::warning::Bugün için çıktı yazılmadı (maç yok ya da hepsi başarısız)."
            echo "has_data=false" >> "$GITHUB_OUTPUT"
          else
            echo "RAW=$RAW" >> "$GITHUB_ENV"
            echo "has_data=true" >> "$GITHUB_OUTPUT"
          fi

      - name: AI için sadeleştir
        if: steps.scrape.outputs.has_data == 'true'
        run: python scripts/optimize.py "$RAW" "data/$DAY"

      - name: Artifact yükle
        if: steps.scrape.outputs.has_data == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: odds-${{ env.DAY }}
          path: |
            raw/
            data/${{ env.DAY }}/
          retention-days: 14

      - name: Özeti repoya yaz (ham veri yazılmaz)
        if: steps.scrape.outputs.has_data == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "data/$DAY"
          git diff --cached --quiet || git commit -m "odds $DAY"
          git push
