name: Scrape Odds

on:
  workflow_dispatch:
    inputs:
      sport:
        description: "Spor (football, tennis, basketball, ...)"
        required: true
        default: football
      leagues:
        description: "Lig kodları, virgülle ayır (örn: england-premier-league,spain-laliga)"
        required: true
      markets:
        description: "Marketler (boş bırakılırsa football için tümü)"
        required: false
        default: ""
      timezone:
        description: "Günün hesaplandığı saat dilimi"
        required: true
        default: Europe/Istanbul
      odds_history:
        description: "Oran geçmişini de çek (yavaşlatır)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: scrape-odds
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install OddsHarvester + Chromium
        run: |
          pip install oddsharvester
          playwright install --with-deps chromium

      - name: Scrape today's matches
        env:
          PROXY_URL: ${{ secrets.PROXY_URL }}
          SPORT: ${{ inputs.sport }}
          LEAGUES: ${{ inputs.leagues }}
          MARKETS: ${{ inputs.markets }}
          TZ_NAME: ${{ inputs.timezone }}
          ODDS_HISTORY: ${{ inputs.odds_history }}
        run: |
          set -euo pipefail

          # Sadece bugünün tarihi (seçilen saat diliminde)
          DATE=$(TZ="$TZ_NAME" date +%Y%m%d)

          # Tüm marketler (football için varsayılan)
          if [ -z "$MARKETS" ]; then
            if [ "$SPORT" = "football" ]; then
              MARKETS="1x2,btts,double_chance,draw_no_bet,over_under,european_handicap,asian_handicap"
            else
              echo "::error::$SPORT için 'markets' girdisini doldur."
              exit 1
            fi
          fi

          EXTRA=()
          if [ "$ODDS_HISTORY" = "true" ]; then
            EXTRA+=(--odds-history)
          fi

          mkdir -p data
          LEAGUE_TAG=$(echo "$LEAGUES" | tr ',' '_' | cut -c1-80)
          OUT="data/${DATE}_${SPORT}_${LEAGUE_TAG}.json"

          oddsharvester upcoming \
            -s "$SPORT" \
            -l "$LEAGUES" \
            -d "$DATE" \
            -m "$MARKETS" \
            --timezone "$TZ_NAME" \
            --proxy-url "$PROXY_URL" \
            --concurrency 2 \
            --request-delay 2 \
            --headless \
            -f json \
            -o "$OUT" \
            "${EXTRA[@]}"

          echo "DATE=$DATE" >> "$GITHUB_ENV"

      - name: Commit & push
        env:
          SPORT: ${{ inputs.sport }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "Commitlenecek değişiklik yok (maç bulunamadı olabilir)."
            exit 0
          fi
          git commit -m "odds: ${SPORT} ${DATE}"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
