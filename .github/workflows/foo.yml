name: Football High-Variance Odds Harvester & AI Optimizer

on:
  schedule:
    # Her gün 08:00 UTC'de (Türkiye saatiyle 11:00 - Avrupa gündüz/akşam fikstürü öncesi) çalışır
    - cron: '0 8 * * *'
  workflow_dispatch:
    inputs:
      hours_window:
        description: 'Kaç saat içindeki futbol maçları çekilsin?'
        required: false
        default: '24'

permissions:
  contents: write

jobs:
  scrape-and-optimize-football:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      OH_PROXY_URL: ${{ secrets.PROXY_URL }}
      OH_PROXY_USER: ${{ secrets.PROXY_USER }}
      OH_PROXY_PASS: ${{ secrets.PROXY_PASS }}

    steps:
      - name: Depoyu Klonla (Checkout)
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Python 3.12 Kurulumu
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: OddsHarvester ve Playwright Tarayıcısını Kur
        run: |
          pip install --upgrade pip
          pip install oddsharvester
          playwright install --with-deps chromium

      - name: Tarih ve Klasör Yapısını Hazırla
        id: date_setup
        run: |
          TODAY=$(date -u +"%Y-%m-%d")
          OUTPUT_DIR="data/football/${TODAY}"
          mkdir -p "${OUTPUT_DIR}"
          echo "today=${TODAY}" >> $GITHUB_OUTPUT
          echo "output_dir=${OUTPUT_DIR}" >> $GITHUB_OUTPUT

      - name: Yüksek Varyanslı Futbol Liglerinin Tüm Oranlarını Çek
        run: |
          HOURS="${{ github.event.inputs.hours_window || '24' }}"
          RAW_FILE="${{ steps.date_setup.outputs.output_dir }}/football_raw_odds.json"

          PROXY_ARGS=()
          if [ -n "$OH_PROXY_URL" ]; then
            PROXY_ARGS+=(--proxy-url "$OH_PROXY_URL")
          fi
          if [ -n "$OH_PROXY_USER" ]; then
            PROXY_ARGS+=(--proxy-user "$OH_PROXY_USER")
          fi
          if [ -n "$OH_PROXY_PASS" ]; then
            PROXY_ARGS+=(--proxy-pass "$OH_PROXY_PASS")
          fi

          LEAGUES=(
            # Hollanda & Belçika
            "football/netherlands/eerste-divisie"
            "football/netherlands/eredivisie"
            "football/belgium/challenger-pro-league"
            # Almanya & Avusturya & İsviçre
            "football/germany/2-bundesliga"
            "football/germany/3-liga"
            "football/austria/2-liga"
            "football/switzerland/challenge-league"
            # İskandinav
            "football/norway/obos-ligaen"
            "football/norway/eliteserien"
            "football/sweden/superettan"
            "football/iceland/besta-deild-karla"
            # İngiltere Alt Ligleri
            "football/england/league-one"
            "football/england/league-two"
            "football/england/national-league"
            # Açık Futbol
            "football/australia/a-league"
            "football/usa/mls"
          )

          LEAGUE_LIST=$(IFS=, ; echo "${LEAGUES[*]}")

          # Desteklenen tüm futbol marketleri:
          # - Temel: 1x2, btts, double_chance, dnb
          # - Şemsiye (tüm baremleri tek seferde açar): over_under, asian_handicap
          # - Avrupa Handikap (8 barem açıkça tanımlı): european_handicap_-4 ... +4
          MARKETS=(
            "1x2"
            "btts"
            "double_chance"
            "dnb"
            "over_under"
            "asian_handicap"
            "european_handicap_-4"
            "european_handicap_-3"
            "european_handicap_-2"
            "european_handicap_-1"
            "european_handicap_+1"
            "european_handicap_+2"
            "european_handicap_+3"
            "european_handicap_+4"
          )

          MARKET_LIST=$(IFS=, ; echo "${MARKETS[*]}")

          oddsharvester upcoming \
            -s football \
            -l "${LEAGUE_LIST}" \
            -m "${MARKET_LIST}" \
            --kickoff-within-hours "${HOURS}" \
            --timezone UTC \
            -c 3 \
            -f json \
            -o "${RAW_FILE}" \
            --headless \
            "${PROXY_ARGS[@]}" || echo "Uyarı: Belirtilen zaman diliminde maç bulunamadı veya kısmi çıkış yapıldı."

      - name: Verileri Yapay Zeka (LLM) Analizi İçin Optimize Et
        run: |
          OUT_DIR="${{ steps.date_setup.outputs.output_dir }}"
          TODAY="${{ steps.date_setup.outputs.today }}"

          if [ -f "${OUT_DIR}/football_raw_odds.json" ]; then
            python scripts/optimize_for_ai.py \
              "${OUT_DIR}/football_raw_odds.json" \
              "${OUT_DIR}/football_ai_optimized.json" \
              "${OUT_DIR}/football_ai_prompt_ready.md" \
              "${TODAY}"
          else
            echo "Ham veri dosyası (${OUT_DIR}/football_raw_odds.json) bulunamadı, optimizasyon adımı atlanıyor."
          fi

          if [ -f "${OUT_DIR}/football_ai_optimized.json" ]; then
            mkdir -p data/football/latest
            cp "${OUT_DIR}/football_ai_optimized.json" data/football/latest/football_ai_optimized.json
            cp "${OUT_DIR}/football_ai_prompt_ready.md" data/football/latest/football_ai_prompt_ready.md
          fi

      - name: Verileri GitHub Deposuna Commit ve Push Et
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          git add data/football/

          if git diff --staged --quiet; then
            echo "Commit edilecek yeni veri yok (Bugün seçili liglerde maç bulunmuyor olabilir)."
          else
            git commit -m "data(football): ${{ steps.date_setup.outputs.today }} yüksek varyanslı futbol oranları [skip ci]"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
